name: AI Lead System CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: admin123
          MYSQL_DATABASE: lead_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -padmin123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      GROQ_API_KEY: dummy_key
      SECRET_KEY: dummy_secret_key_for_ci
      MYSQL_USER: root
      MYSQL_PASSWORD: admin123
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DB: lead_db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest -v

      - name: Run Coverage
        run: |
          pytest --cov=src --cov-fail-under=75

      - name: Build Docker Image
        run: |
          docker build -t ai-lead-system .