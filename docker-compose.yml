services:

  mysql:

    image: mysql:8.4

    container_name: lead_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: lead_db

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:

    build: .

    container_name: lead_api

    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      MYSQL_HOST: mysql

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: